version: '3.8'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: renderbyte
      POSTGRES_PASSWORD: renderbyte_password
      POSTGRES_DB: renderbyte_sync
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./RenderByte.Sync.Api/Scripts:/docker-entrypoint-initdb.d

volumes:
  db_data:
